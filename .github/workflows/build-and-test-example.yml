name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Build and test
        run: |
          xcodebuild clean test \
          -project Example/MoreDrama.xcodeproj \
          -scheme MoreDrama \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.4'
